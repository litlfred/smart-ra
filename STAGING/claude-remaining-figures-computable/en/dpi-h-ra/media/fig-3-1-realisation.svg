<g class="av-legend"><rect x="14" y="308" width="705" height="244" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="326">Key</text><text class="av-keyh" x="24" y="342">Colour: which part of the architecture a box belongs to</text><rect x="24" y="351" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="362">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="24" y="371" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="382">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="24" y="402">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="24" y="410" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="426">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="24" y="440" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="456">Rounded ends: a service, offered for others to use</text><rect x="24" y="470" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="486">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="24" y="512">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M34 528 L66 528" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="532">Realization: makes real, or achieves</text></g></svg>
