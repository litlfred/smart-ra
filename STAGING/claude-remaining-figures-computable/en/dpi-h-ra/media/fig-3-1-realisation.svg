</defs><rect x="4" y="-48" width="735" height="620" fill="#f8f9fb"/><rect x="4" y="-48" width="735" height="52" fill="#14213d"/><text x="24" y="-24" style="font:700 17px Inter, &quot;Segoe UI&quot;, system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#fff">Realisation relationships among architectural elements (Fig. 3.1)</text><text x="24" y="-7" style="font:italic 10px Inter, &quot;Segoe UI&quot;, system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#c9d6e6">Drawn from the ArchiMate model “WHO_RA”</text><g><title>Identity maintained across services (Capability)</title><rect x="24" y="24" width="170" height="55" rx="8" fill="#f5deaa" stroke="#877a5e" stroke-width="1"/><text class="av-type" x="189" y="34" text-anchor="end">Capability</text><text class="av-name" x="109" y="47" text-anchor="middle"><tspan x="109" dy="0">Identity maintained</tspan><tspan x="109" dy="13.75">across services</tspan></text></g>
