<g class="av-legend"><rect x="14" y="568" width="829" height="244" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="586">Key</text><text class="av-keyh" x="24" y="602">Colour: which part of the architecture a box belongs to</text><rect x="24" y="611" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="622">Software: systems and their parts, the services they offer, and the data they hold</text><rect x="24" y="631" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="82" y="642">Technology: the devices, platforms and networks the software runs on</text><text class="av-keyh" x="24" y="662">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="24" y="670" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="686">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="24" y="712">Other marks</text><rect x="24" y="719" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="724" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="732">A box inside another box: a part of it</text><rect x="24" y="741" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="741" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="752">Band with a dark header: a grouping for layout only; it adds no meaning (tinted in the layer most of its boxes belong to)</text><text class="av-keyh" x="24" y="772">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M34 788 L66 788" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="792">Flow: passes something, such as information, to</text></g></svg>
