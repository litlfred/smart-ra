</defs><rect x="40" y="76" width="917" height="785" fill="#fff"/><g class="av-n"><polygon points="60,96 459,96 469,106 469,133 60,133" fill="#ffffff" stroke="#888"/><text class="av-note" x="66" y="111"><tspan x="66" dy="0">Digitally strengthened Health Financing</tspan></text></g>
<a href="../elements/id-f5e881e907714bedb922a6697059c8d0/" target="_top"><title>Ensure effective, equitable and sustainable health financing and public financial management receive reliable digital tools to support intermediate UHC objectives (equitable distribution of resources, efficiency, transparency) and final UHC goals (access in line with need, financial protection, quality of care) (Goal)</title><polygon points="94,156 927,156 937,166 937,226 927,236 94,236 84,226 84,166" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="928" y="166" text-anchor="end">Goal</text><text class="av-name" x="510.5" y="179" text-anchor="middle"><tspan x="510.5" dy="0">Ensure effective, equitable and sustainable health financing and public financial management receive reliable digital tools to support</tspan><tspan x="510.5" dy="13.75">intermediate UHC objectives (equitable distribution of resources, efficiency, transparency) and final UHC goals (access in line with</tspan><tspan x="510.5" dy="13.75">need, financial protection, quality of care)</tspan></text></a>
<a href="../elements/id-ae39ff76e952414085ddd92534e6aa3e/" target="_top"><title>Public Financial Management (Grouping)</title><rect x="96" y="288" width="385" height="553" fill="#ffffff" stroke="#8c8c8c" stroke-width="1"/><text class="av-type" x="476" y="298" text-anchor="end">Grouping</text><text class="av-name" x="288.5" y="311" text-anchor="middle"><tspan x="288.5" dy="0">Public Financial Management</tspan></text></a>
<a href="../elements/id-5a932fe7f4e2446bb7c31c668d855ca6/" target="_top"><title>Health sector monitoring and auditing: Ensure accountable use of health funds through auditability, oversight reporting and appropriate public disclosure (Goal)</title><polygon points="150,624 439,624 449,634 449,687 439,697 150,697 140,687 140,634" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="440" y="634" text-anchor="end">Goal</text><text class="av-name" x="294.5" y="647" text-anchor="middle"><tspan x="294.5" dy="0">Health sector monitoring and auditing: Ensure</tspan><tspan x="294.5" dy="13.75">accountable use of health funds through</tspan><tspan x="294.5" dy="13.75">auditability, oversight reporting and</tspan><tspan x="294.5" dy="13.75">appropriate public disclosure</tspan></text></a>
<a href="../elements/id-1454642641de49a8bbe34a20c6aee515/" target="_top"><title>Pooling of funds: Allocate pooled health funds equitably across programmes, regions and populations to support redistributive capacity and to achieve financial protection (Goal)</title><polygon points="150,540 439,540 449,550 449,597 439,607 150,607 140,597 140,550" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="440" y="550" text-anchor="end">Goal</text><text class="av-name" x="294.5" y="563" text-anchor="middle"><tspan x="294.5" dy="0">Pooling of funds: Allocate pooled health funds</tspan><tspan x="294.5" dy="13.75">equitably across programmes, regions and</tspan><tspan x="294.5" dy="13.75">populations to support redistributive capacity…</tspan></text></a>
<a href="../elements/id-9d21928daf2b41ee8792e43b2b71cf36/" target="_top"><title>Budget planning, execution and oversight (monitoring): Ensure health budgets are planned, executed and monitored to support efficient budget execution, transparency and providers paid on time. (Goal)</title><polygon points="150,360 439,360 449,370 449,435 439,445 150,445 140,435 140,370" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="440" y="370" text-anchor="end">Goal</text><text class="av-name" x="294.5" y="383" text-anchor="middle"><tspan x="294.5" dy="0">Budget planning, execution and oversight</tspan><tspan x="294.5" dy="13.75">(monitoring): Ensure health budgets are planned,</tspan><tspan x="294.5" dy="13.75">executed and monitored to support efficient</tspan><tspan x="294.5" dy="13.75">budget execution, transparency and providers</tspan><tspan x="294.5" dy="13.75">paid on time.</tspan></text></a>
<a href="../elements/id-efbdd2ae92f54feb8d3de2433a68571e/" target="_top"><title>Revenue raising (e.g., taxes, insurance contributions): Secure sufficient and sustainable funds for the health sector in an efficient and equitable way (Goal)</title><polygon points="150,456 439,456 449,466 449,519 439,529 150,529 140,519 140,466" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="440" y="466" text-anchor="end">Goal</text><text class="av-name" x="294.5" y="479" text-anchor="middle"><tspan x="294.5" dy="0">Revenue raising (e.g., taxes, insurance</tspan><tspan x="294.5" dy="13.75">contributions): Secure sufficient and</tspan><tspan x="294.5" dy="13.75">sustainable funds for the health sector in an</tspan><tspan x="294.5" dy="13.75">efficient and equitable way</tspan></text></a>
<a href="../elements/id-bedf9520ae124dc5984b89faebc483d6/" target="_top"><title>Health financing to provide coverage  (Grouping)</title><rect x="540" y="288" width="385" height="553" fill="#ffffff" stroke="#8c8c8c" stroke-width="1"/><text class="av-type" x="920" y="298" text-anchor="end">Grouping</text><text class="av-name" x="732.5" y="311" text-anchor="middle"><tspan x="732.5" dy="0">Health financing to provide coverage</tspan></text></a>
<a href="../elements/id-70d2329bcee6491aa113006670ec7741/" target="_top"><title>Revenue raising for health financing to provide coverage (e.g., taxes, insurance contributions): Secure sustainable, equitable health sector funds. (Goal)</title><polygon points="588,324 863,324 873,334 873,387 863,397 588,397 578,387 578,334" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="864" y="334" text-anchor="end">Goal</text><text class="av-name" x="725.5" y="347" text-anchor="middle"><tspan x="725.5" dy="0">Revenue raising for health financing to</tspan><tspan x="725.5" dy="13.75">provide coverage (e.g., taxes, insurance</tspan><tspan x="725.5" dy="13.75">contributions): Secure sustainable, equitable</tspan><tspan x="725.5" dy="13.75">health sector funds.</tspan></text></a>
<a href="../elements/id-b32cf0be367f438b8259d158433141ac/" target="_top"><title>Targeting &amp; identification: Ensure all individuals (across diverse population segments such as vulnerable, informal, and formal) are identified and correctly targeted for coverage and benefits, enabling affordable and equitable access and real-time eligibility decisions. (Goal)</title><polygon points="588,407 863,407 873,417 873,470 863,480 588,480 578,470 578,417" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="864" y="417" text-anchor="end">Goal</text><text class="av-name" x="725.5" y="430" text-anchor="middle"><tspan x="725.5" dy="0">Targeting &amp; identification: Ensure all</tspan><tspan x="725.5" dy="13.75">individuals (across diverse population</tspan><tspan x="725.5" dy="13.75">segments such as vulnerable, informal, and</tspan><tspan x="725.5" dy="13.75">formal) are identified and correctly targeted…</tspan></text></a>
<a href="../elements/id-1620fafd9f89463b9c315ef6cbde40ed/" target="_top"><title>Pooling of funds: Manage pooled funds at scheme level for financial protection, coverage continuity, efficient resource use. (Goal)</title><polygon points="588,492 863,492 873,502 873,555 863,565 588,565 578,555 578,502" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="864" y="502" text-anchor="end">Goal</text><text class="av-name" x="725.5" y="515" text-anchor="middle"><tspan x="725.5" dy="0">Pooling of funds: Manage pooled funds at</tspan><tspan x="725.5" dy="13.75">scheme level for financial protection,</tspan><tspan x="725.5" dy="13.75">coverage continuity, efficient resource use.</tspan></text></a>
<a href="../elements/id-bbda116d3e4045edb39ecb17d51a9461/" target="_top"><title>Purchasing (including contracting, provider payments, claims management, benefits specification): Ensure affordable, efficient purchasing with timely payments, cost control, transparency. (Goal)</title><polygon points="588,576 863,576 873,586 873,639 863,649 588,649 578,639 578,586" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="864" y="586" text-anchor="end">Goal</text><text class="av-name" x="725.5" y="599" text-anchor="middle"><tspan x="725.5" dy="0">Purchasing (including contracting, provider</tspan><tspan x="725.5" dy="13.75">payments, claims management, benefits</tspan><tspan x="725.5" dy="13.75">specification): Ensure affordable, efficient</tspan><tspan x="725.5" dy="13.75">purchasing with timely payments, cost control…</tspan></text></a>
<a href="../elements/id-64ecddde618344efb5e910b513e9d3dc/" target="_top"><title>Benefits design: Define coherent entitlements, access conditions, services, populations, price/non-price terms. (Goal)</title><polygon points="588,660 863,660 873,670 873,723 863,733 588,733 578,723 578,670" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="864" y="670" text-anchor="end">Goal</text><text class="av-name" x="725.5" y="683" text-anchor="middle"><tspan x="725.5" dy="0">Benefits design: Define coherent entitlements,</tspan><tspan x="725.5" dy="13.75">access conditions, services, populations,</tspan><tspan x="725.5" dy="13.75">price/non-price terms.</tspan></text></a>
<a href="../elements/id-ddfdcb47aa7e486ab7d23dd87ca442e6/" target="_top"><title>Safeguarding: Enforce privacy, security, fraud controls across coverage operations. (Goal)</title><polygon points="588,744 863,744 873,754 873,807 863,817 588,817 578,807 578,754" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="864" y="754" text-anchor="end">Goal</text><text class="av-name" x="725.5" y="767" text-anchor="middle"><tspan x="725.5" dy="0">Safeguarding: Enforce privacy, security, fraud</tspan><tspan x="725.5" dy="13.75">controls across coverage operations.</tspan></text></a>
