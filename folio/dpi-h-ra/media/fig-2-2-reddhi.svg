<g class="av-legend"><rect x="14" y="278" width="829" height="234" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="296">Key</text><text class="av-keyh" x="24" y="312">Colour: which part of the architecture a box belongs to</text><rect x="24" y="321" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="82" y="332">Why: who cares (stakeholders), and the drivers, goals, outcomes, values and requirements</text><rect x="24" y="341" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="352">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="24" y="372">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><polygon points="30,380 62,380 68,386 68,398 62,404 30,404 24,398 24,386" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="396">Cut corners: a reason or aim, such as a stakeholder, goal, outcome or value</text><rect x="24" y="410" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="426">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="24" y="452">Other marks</text><rect x="24" y="459" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="464" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="472">A box inside another box: a part of it</text><rect x="24" y="481" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="481" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="492">Band with a dark header: a grouping for layout only; it adds no meaning (tinted in the layer most of its boxes belong to)</text></g></svg>
