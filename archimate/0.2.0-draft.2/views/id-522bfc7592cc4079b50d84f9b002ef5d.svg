<a href="../elements/id-abb133e470654aa384d6b646525d7681/" target="_top"><title>Enable patient control and consent-based sharing of health information (Goal)</title><polygon points="524,300 791,300 801,310 801,351 791,361 524,361 514,351 514,310" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="792" y="310" text-anchor="end">Goal</text><text class="av-name" x="657.5" y="323" text-anchor="middle"><tspan x="657.5" dy="0">Enable patient control and consent-based</tspan><tspan x="657.5" dy="13.75">sharing of health information</tspan></text></a>
