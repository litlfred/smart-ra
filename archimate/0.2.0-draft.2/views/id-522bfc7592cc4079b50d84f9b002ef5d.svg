<a href="../elements/id-486edcfed0be4583a1cace8de084ed05/" target="_top"><title>TPHR Goals (Grouping)</title><rect x="202" y="156" width="1237" height="228" fill="#ffffff" stroke="#8c8c8c" stroke-width="1"/><text class="av-type" x="1434" y="166" text-anchor="end">Grouping</text><text class="av-name" x="820.5" y="179" text-anchor="middle"><tspan x="820.5" dy="0">TPHR Goals</tspan></text></a>
<a href="../elements/id-b6bc801d5df44f6aa007fca9eb15807e/" target="_top"><title>Develop a secure and universally accessible system for issuing verifiable digital health records to individuals for their utilization as they seek care, following appropriate safeguards for privacy, security and consent (Goal)</title><polygon points="248,192 1392,192 1402,202 1402,243 1392,253 248,253 238,243 238,202" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="1393" y="202" text-anchor="end">Goal</text><text class="av-name" x="820" y="215" text-anchor="middle"><tspan x="820" dy="0">Develop a secure and universally accessible system for issuing verifiable digital health records to individuals for their utilization as they seek care, following appropriate safeguards</tspan><tspan x="820" dy="13.75">for privacy, security and consent</tspan></text></a>
<a href="../elements/id-c0715bcb11cf4837ad93493ca9ae10ac/" target="_top"><title>Support interoperability across providers, facilities, and jurisdictions (Goal)</title><polygon points="1148,300 1381,300 1391,310 1391,351 1381,361 1148,361 1138,351 1138,310" fill="#ccccff" stroke="#70708c" stroke-width="1"/><text class="av-type" x="1382" y="310" text-anchor="end">Goal</text><text class="av-name" x="1264.5" y="323" text-anchor="middle"><tspan x="1264.5" dy="0">Support interoperability across</tspan><tspan x="1264.5" dy="13.75">providers, facilities, and</tspan><tspan x="1264.5" dy="13.75">jurisdictions</tspan></text></a>
