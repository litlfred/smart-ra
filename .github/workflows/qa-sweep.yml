# QA sweep: every integration watcher over this folio's blocks, warn-only.
# Derived verdicts go to the orphan qa-reports branch; judgements stay on
# main in test/attestations/.
#
# A thin caller: the steps are cat-harness-tools' reusable workflow, ONE
# copy for every harnessed repository (cat-harness-tools#1038), so this
# repository's CI cannot drift from smart-ra's or dth-hrh's again.
name: QA sweep (all integration watchers)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  qa-sweep:
    uses: litlfred/cat-harness-tools/.github/workflows/folio-qa-sweep.yml@main
