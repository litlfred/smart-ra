# The review record (review/public-comment): change-set records and their issues agree.
# Manual trigger only (owner decision, 2026-10-06).
#
# A thin caller: the steps are cat-harness-tools' reusable workflow, ONE
# copy for every harnessed repository (cat-harness-tools#1038), so this
# repository's CI cannot drift from smart-ra's or dth-hrh's again.
name: Public comment — change-set records and their issues agree

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    uses: litlfred/folio-assistant-core/.github/workflows/public-comment-check.yml@5ee67091fcfc45f05cf53e7de1262988e5ae394e # index.lock.json
    with:
      store: review/public-comment
      label: public comment
