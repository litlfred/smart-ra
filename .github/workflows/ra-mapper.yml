name: Build & Deploy RA Mapper

# Re-rendered after every successful build of main (owner, 2026-10-09:
# "rerender post build"), chained after the staging build rather than run
# beside it: both push to gh-pages, and peaceiris does not retry a rejected
# push. The Archi HTML report this used to follow is gone (owner, 2026-10-09:
# "do not do java 200mb"); the views are drawn by the staging build itself.
# The mapper is Python and a single static page — no JVM.
# By hand only from 2026-10-10 (bean n3h9): the staging build it chained
# after no longer runs on push.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build mapper
        run: |
          cd tools/ra-mapper

          # The current version is the IG's (`version:` in sushi-config.yaml), listed
          # first so it becomes the mapper's default; the other SemVer folders
          # follow, newest first. See archimate/README.md.
          CURRENT=$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' ../../sushi-config.yaml | head -n1)

          MODELS=(); LABELS=()
          add() {
            local m
            m=$(find "$1" -maxdepth 1 -name '*.archimate' -type f | head -1)
            if [ -n "$m" ]; then MODELS+=("$m"); LABELS+=("$2"); fi
          }

          if [ -n "$CURRENT" ] && [ -d "../../archimate/$CURRENT" ]; then
            add "../../archimate/$CURRENT" "WHO RA $CURRENT (current)"
          else
            echo "::warning::sushi-config.yaml is at version '${CURRENT:-<none>}' but archimate/${CURRENT:-<none>}/ does not exist — the mapper has no current model."
          fi
          for NAME in $(ls ../../archimate | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' | sort -rV); do
            [ "$NAME" = "$CURRENT" ] && continue
            add "../../archimate/$NAME" "WHO RA $NAME"
          done

          echo "Building mapper with: ${LABELS[*]}"
          python3 build_ra_mapper.py "${MODELS[@]}" -l "${LABELS[@]}" -o SMART-RA-Mapper.html

      - name: Prepare deploy layout
        run: |
          mkdir -p deploy_output/mapper
          cp tools/ra-mapper/SMART-RA-Mapper.html deploy_output/mapper/index.html
          cp tools/ra-mapper/SMART-RA-Mapper.html deploy_output/mapper/SMART-RA-Mapper.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_output
          publish_branch: gh-pages
          keep_files: true
