name: Staging preview

# A before/after preview of this folio for every pull request, published to
# STAGING/<branch>/ on gh-pages, with the ChangeSet (what changed, block by
# block) beside it. A push to main publishes main's site at the gh-pages root:
# the "before" side. The mechanics live in the platform's reusable workflow.
#
# The site is built by the platform's build-document-site.ts: one page per
# document, with an anchor on every labelled block. public-comment-site.ts then
# adds the public-comment dashboard (public-comments/) and shows each comment
# beside the block it is about. A preview at STAGING/<branch>/ is the AFTER
# side of every comment's deep link; main's site at the root is the BEFORE.
# gen-node-kind-pages.ts then writes a page per node kind, per harness and per
# node under en/<declaring>/<kind>/ (issue litlfred/folio-assistant#2195): the
# change-sets with the comments each answers, and each comment with its
# change-sets. It fails the build if any planned page does not resolve.
# Last, cat-harness's archimate subgraph (skill `archimate-models`) checks the
# ArchiMate models and writes /archimate/: every view drawn as SVG, every view,
# element and relationship a page and an IRI. No Java, no Archi CLI.

# Runs as CI again (owner, 2026-10-09: "it needs CI"), reversing the
# 2026-10-06 dispatch-only decision for this workflow: every pull request gets
# its STAGING/<branch>/ preview, and every push to main republishes the root.
# Dispatch stays, for the public-comment intake's GITHUB_TOKEN commits, which
# cannot start a push run.
# Agent-run from 2026-10-10 (owner: "agent-run as well", bean n3h9): the
# harnessed site is built and published by an agent, so this workflow no
# longer runs on push or pull request. Dispatch stays, for the public-comment
# intake's GITHUB_TOKEN commits and for a by-hand preview.
on:
  workflow_dispatch:

# What the reusable workflow needs, and no more: publish the preview, comment
# on the pull request, and read its comments for the review page.
permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  staging:
    uses: litlfred/folio-assistant/.github/workflows/folio-staging.yml@main
    with:
      build_command: 'T=folio-assistant/cat-harness-tools; [ -d "$T/archimate/scripts" ] || T=folio-assistant/cat-harness; bun run folio-assistant/folio-assistant-core/scripts/build-document-site.ts --out _site && bun run folio-assistant/folio-assistant-core/scripts/public-comment-site.ts --out _site && bun run folio-assistant/folio-assistant-core/scripts/build-library-site.ts --out _site && bun run "$T/scripts/gen-node-kind-pages.ts" --root . --out _site && bun run "$T/archimate/scripts/check-archimate.ts" --instance . && bun run "$T/archimate/scripts/gen-archimate-pages.ts" --instance . --out _site'
      site_dir: _site
      folio_dir: folio
      platform_dir: folio-assistant
