# The review record (review/public-comment): tags, change-sets and their issues. The steps
# and the comment grammar are documented in folio-assistant-core's
# public-comment.yml. Manual trigger only (owner decision, 2026-10-06).
#
# A thin caller: the steps are cat-harness-tools' reusable workflow, ONE
# copy for every harnessed repository (cat-harness-tools#1038), so this
# repository's CI cannot drift from smart-ra's or dth-hrh's again.
name: Public comment — tags, change-sets and their issues

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  record:
    uses: litlfred/folio-assistant-core/.github/workflows/public-comment.yml@4f18e66ede3404816a99c63c2a6865a2f32541a5 # index.lock.json
    with:
      store: review/public-comment
      label: public comment
