# Site publish: stage-local.ts on a GitHub runner, from the steps this
# repository's instance declares under site.build. It runs on every push to
# main (a merged PR), and by hand. On main it publishes the gh-pages root; on
# any other branch, STAGING/<branch>/.
#
# A thin caller: the steps are cat-harness-tools' reusable workflow, ONE
# copy for every harnessed repository (cat-harness-tools#1038), so this
# repository's CI cannot drift from smart-ra's or dth-hrh's again.
name: Site publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plan:
        description: "Only print what would run (--plan)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    uses: litlfred/cat-harness-tools/.github/workflows/folio-site-publish.yml@c7abeaf5a155c5681e791e066cbcf343a3f96cf2 # index.lock.json
    with:
      plan: ${{ inputs.plan == true }}
