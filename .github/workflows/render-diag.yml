# TEMPORARY diagnostic (cat-harness-tools#1299 item 3): find what makes a
# GitHub runner draw smart-base's processes with whole-pixel text positions.
# Lives only on the scratch branch claude/render-diag.
name: Render diagnostic (scratch)
on:
  push:
    branches: [claude/render-diag]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Mount layers from the lock
        run: |
          ref=$(python3 -c "import json;print(next(m['ref'] for m in json.load(open('index.lock.json'))['mounts'] if m['harness']=='cat-harness-tools'))")
          M=$(mktemp -d)
          git init -q "$M" && git -C "$M" fetch -q --depth 1 https://github.com/litlfred/cat-harness-tools.git "$ref" && git -C "$M" checkout -q FETCH_HEAD
          bun run "$M/scripts/mount-from-lock.ts" --root .
      - run: bun install
      - run: node_modules/.bin/playwright install --with-deps chromium
      - name: Variants
        run: |
          cp bootstrap-tools/scripts/render-bpmn.ts "$RUNNER_TEMP/rb.ts"
          try() {
            cp "$RUNNER_TEMP/rb.ts" bootstrap-tools/scripts/render-bpmn.ts
            sed -i "s|chromium.launch(executablePath ? { executablePath } : {})|chromium.launch({ ...(executablePath ? { executablePath } : {}), args: [$2] })|" bootstrap-tools/scripts/render-bpmn.ts
            n=$(env $3 bun run smart-base/scripts/render-processes.ts --check 2>&1 | grep -c '✗' || true)
            echo "VARIANT $1: stale=$n"
          }
          try baseline "" "X=1"
          try hinting-none "'--font-render-hinting=none'" "X=1"
          try hinting-medium "'--font-render-hinting=medium'" "X=1"
          printf '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig><dir>/usr/share/fonts</dir><match target="font"><edit name="hinting" mode="assign"><bool>false</bool></edit><edit name="hintstyle" mode="assign"><const>hintnone</const></edit><edit name="antialias" mode="assign"><bool>true</bool></edit><edit name="rgba" mode="assign"><const>none</const></edit></match></fontconfig>' > "$RUNNER_TEMP/fonts.conf"
          try fontconfig-nohint "" "FONTCONFIG_FILE=$RUNNER_TEMP/fonts.conf"
          try both "'--font-render-hinting=none'" "FONTCONFIG_FILE=$RUNNER_TEMP/fonts.conf"
          try headful-chrome "'--font-render-hinting=none'" "CHROMIUM_PATH=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome | head -1)"
          fc-match -v Arial | grep -E 'hint|rgba|antialias|file' || true
