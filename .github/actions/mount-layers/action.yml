# Lay down the platform's layers as the remote mounts index.lock.json pins,
# and install their dependencies — the replacement for checking out the
# folio-assistant submodule (bean n3h9). Use after actions/checkout.
#
# mount-from-lock.ts imports only node:*, so it runs before anything else is
# installed. It is taken from cat-harness-tools at the commit the lock pins;
# it then fetches every locked instance at its SHA and verifies each
# directory's tree digest. Sets FA_TOOLS to the cat-harness-tools mount.

name: Mount the platform's layers
description: Mount every layer index.lock.json pins, install their dependencies, and set FA_TOOLS.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14  # the platform's CI version

    - name: Mount the layers index.lock.json pins
      shell: bash
      run: |
        ref=$(python3 -c "import json;print(next(m['ref'] for m in json.load(open('index.lock.json'))['mounts'] if m['harness']=='cat-harness-tools'))")
        M="$RUNNER_TEMP/mounter"
        rm -rf "$M"
        git init -q "$M"
        git -C "$M" fetch -q --depth 1 https://github.com/litlfred/cat-harness-tools.git "$ref"
        git -C "$M" checkout -q FETCH_HEAD
        bun run "$M/scripts/mount-from-lock.ts" --root .
        echo "FA_TOOLS=cat-harness-tools" >> "$GITHUB_ENV"

    - name: Install the mounted layers' dependencies
      shell: bash
      run: |
        for d in $(python3 -c "import json;print(' '.join(sorted({i['path'] for i in json.load(open('index.lock.json'))['instances']})))"); do
          if [ -f "$d/package.json" ]; then
            echo "── $d"
            (cd "$d" && bun install --no-save)
          fi
        done
